name: Docker Build & Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [distributor, query]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/${{ matrix.service }}/Dockerfile -t mocha-${{ matrix.service }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mocha-${{ matrix.service }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
