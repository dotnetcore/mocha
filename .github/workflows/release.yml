name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege by default; the release job elevates to contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build third-party modules
        run: dotnet build ./src/Mocha.Protocol.Generated
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release
      # Only publish a GitHub Release for an actual tag push (e.g. v0.1.0).
      # workflow_dispatch runs above as a build/test dry-run and stops here.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
